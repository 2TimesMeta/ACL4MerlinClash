name: Sync Providers from ACL4SSR

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Clone Source Repository (Single Branch)
        run: |
          # 建立临时文件夹并进入
          mkdir -p temp_source
          cd temp_source
          git init
          git remote add origin https://github.com/ACL4SSR/ACL4SSR.git
          # 开启稀疏检出
          git config core.sparseCheckout true
          # 设置要同步的具体路径
          echo "Clash/Providers/" >> .git/info/sparse-checkout
          # 仅拉取 master 分支
          git pull --depth 1 origin master
          cd ..

      - name: Sync Files
        run: |
          TARGET_DIR="./"
          
          cp -Ru temp_source/Clash/Providers/* "$TARGET_DIR"
          
          # 清理临时文件
          rm -rf temp_source

      - name: Commit and Push
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add .
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # 提交前记录本次变更的文件列表，供后续清除 CDN 缓存使用
            git diff --cached --name-only > /tmp/changed_files.txt
            git commit -m "chore: sync files from ACL4SSR/Clash/Providers ($(date +'%Y-%m-%d %H:%M'))"

            # 先同步远端最新提交并 rebase，避免与其他推送（人工或其他运行）冲突
            pushed=false
            for i in 1 2 3; do
              git pull --rebase origin main || { git rebase --abort; exit 1; }
              if git push origin main; then
                pushed=true
                break
              fi
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
            [ "$pushed" = "true" ] || { echo "Failed to push after retries"; exit 1; }

            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge jsDelivr Cache
        if: steps.commit.outputs.changed == 'true'
        env:
          REPO_SLUG: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          echo "Purging jsDelivr cache for changed files (${REPO_SLUG}@${REF})..."
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # 对路径做 URL 编码，兼容带空格/特殊字符的文件名
            enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$f")
            printf '  -> %s\n' "$enc"
            curl -sS --max-time 30 "https://purge.jsdelivr.net/gh/${REPO_SLUG}@${REF}/${enc}" || true
            echo
          done < /tmp/changed_files.txt
          echo "jsDelivr purge finished."
